# Render Blueprint — free web service. Connect the repo in the Render dashboard
# (New → Blueprint) and it reads this file. GROQ_API_KEY is set in the dashboard
# (sync:false keeps it out of git). The build pre-downloads the embedding model
# so startup isn't a cold download.
services:
  - type: web
    name: grounded-rag
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      python -c "from fastembed import TextEmbedding; TextEmbedding('sentence-transformers/all-MiniLM-L6-v2')" &&
      python -c "from fastembed.rerank.cross_encoder import TextCrossEncoder; TextCrossEncoder('Xenova/ms-marco-MiniLM-L-6-v2')"
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: GROQ_API_KEY
        sync: false
